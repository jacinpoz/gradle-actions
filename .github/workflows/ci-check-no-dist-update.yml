name: CI-check-no-dist-update

# Prohibit any change to 'dist/**' on a non-release branch.
#
# Upstream builds 'dist/' from a workflow, so a change to it in a pull request there is always a mistake.
# This fork has to commit it by hand -- 'ci-update-dist.yml' is gated to the upstream repository and so does
# not run here -- which would make this check fail on every release. It is gated the same way.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dist/**'

permissions:
  contents: read

jobs:
  fail-on-dist-update:
    if: github.repository == 'gradle/actions'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
      with:
        files: |
          dist/**

    - name: Print changes to dist directory
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        for file in ${ALL_CHANGED_FILES}; do
          echo "$file was changed"
        done

    - run: |
        echo "The 'dist' directory is automatically updated by the release process."
        echo "It should not be updated manually in a non-release branch or a pull request."
        exit 1
