name: Release

# Tags a release, moves its major-version tag, and publishes the GitHub release, following RELEASING.md.
#
# Run by hand from main. Only the repository owner may run it: GitHub already limits running a workflow to
# people with write access, and the check below keeps it to the owner even if collaborators are added later.
# Tags pushed from here are annotated but not signed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.3.0)'
        required: true
      commit:
        description: 'Commit on main to release (defaults to the head of main)'
        required: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check who is releasing, and from where
      env:
        ACTOR: ${{ github.actor }}
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        OWNER: ${{ github.repository_owner }}
        REF: ${{ github.ref }}
      run: |
        if [[ "$ACTOR" != "$OWNER" || "$TRIGGERING_ACTOR" != "$OWNER" ]]; then
          echo "::error::Only $OWNER may release; this run was started by $TRIGGERING_ACTOR."
          exit 1
        fi
        if [[ "$REF" != "refs/heads/main" ]]; then
          echo "::error::Releases are run from main, not $REF."
          exit 1
        fi

    - name: Checkout sources
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Check the version and the commit
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$VERSION' is not a version of the form 1.2.3."
          exit 1
        fi
        COMMIT="${COMMIT:-$(git rev-parse origin/main)}"
        if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
          echo "::error::$COMMIT is not on main."
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
          echo "::error::v$VERSION already exists."
          exit 1
        fi
        PACKAGE_VERSION="$(git show "$COMMIT:sources/package.json" | jq -r .version)"
        if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
          echo "::error::sources/package.json at $COMMIT is version $PACKAGE_VERSION, not $VERSION."
          exit 1
        fi
        git show "$COMMIT:CHANGELOG.md" | awk -v heading="## v$VERSION" '
          $0 == heading { found = 1; next }
          found && /^## v/ { exit }
          found { print }
        ' > "$RUNNER_TEMP/notes.md"
        if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
          echo "::error::CHANGELOG.md at $COMMIT has no '## v$VERSION' section."
          exit 1
        fi
        echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

    - name: Tag the release and move the major-version tag
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        MAJOR="v${VERSION%%.*}"
        git tag -a -m "v$VERSION" "v$VERSION" "$COMMIT"
        git tag -f -a -m "v$VERSION" "$MAJOR" "$COMMIT"
        git push origin "refs/tags/v$VERSION"
        git push -f origin "refs/tags/$MAJOR"

    - name: Publish the GitHub release
      run: gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
